# ----------------------------------------------------- 
# VISUAL, BORDAS E CORES
# ----------------------------------------------------- 
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3

    # Cores Macchiato (Lavender para foco, Surface1 para inativo)
    col.active_border = rgba(b7bdf8ff)
    col.inactive_border = rgba(494d64ff)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# ----------------------------------------------------- 
# EFEITOS (SOMBRAS E DESFOQUE)
# ----------------------------------------------------- 
decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 10
        passes = 2
        vibrancy = 0.1696
    }
}

# ----------------------------------------------------- 
# ANIMAÇÕES GERAIS
# ----------------------------------------------------- 
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# ----------------------------------------------------- 
# LAYOUT DWINDLE E MISC
# ----------------------------------------------------- 
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc { 
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
