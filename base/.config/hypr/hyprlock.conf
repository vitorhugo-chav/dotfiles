general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = /caminho/para/seu/wallpaper_do_audi_ou_bmw.png   # Coloque o caminho da sua imagem
    color = rgba(36, 39, 58, 1.0)
    blur_passes = 2 # 0 ativa o wallpaper nítido, 2+ deixa desfocado
}

# HORA
label {
    monitor =
    text = $TIME
    color = rgb(cad3f5)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 80
    halign = center
    valign = center
}

# INPUT FIELD (Senha)
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(b7bdf8)
    inner_color = rgb(24273a)
    font_color = rgb(cad3f5)
    fade_on_empty = false
    placeholder_text = <i>Senha...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# USUÁRIO
label {
    monitor =
    text = Olá, $USER
    color = rgb(b7bdf8)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}
